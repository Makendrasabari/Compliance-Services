<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | Stackly Compliance</title>
  <meta name="description" content="The page you're looking for could not be found. Stackly Compliance & Services.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- UNIQUE PRELOADER -->
  <div class="preloader" id="sitePreloader">
    <div class="preloader-shield-wrapper">
      <div class="preloader-ring"></div>
      <div class="preloader-ring-outer"></div>
      <img src="assets/logo.webp" alt="Stackly Compliance" class="preloader-logo">
    </div>
    <div class="preloader-title">Stackly Compliance</div>
    <div class="preloader-subtext">Enterprise Governance & Regulatory Advisory</div>
    <div class="preloader-progress-bar">
      <div class="preloader-progress-fill"></div>
    </div>
  </div>

  <main class="notfound-wrapper">
    <div class="notfound-card fade-in-up">
      <a href="index.html" class="notfound-brand-wrap" aria-label="Stackly Home">
        <img src="assets/logo.webp" alt="Stackly Logo" class="notfound-logo">
      </a>
      <div class="notfound-code">404</div>
      <h1 class="notfound-msg">The page you're looking for could not be found.</h1>
      <p class="notfound-sub">
        The requested resource may have been relocated, archived under updated compliance protocols, or is temporarily restricted.
      </p>
      <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-lg" id="backToHomeBtn">
          <span class="material-icons">home</span>
          <span>Back to Home</span>
        </a>
        <button type="button" class="btn btn-outline btn-lg" id="goBackBtn" onclick="if(window.history.length > 1){window.history.back();}else{window.location.href='index.html';}">
          <span class="material-icons">arrow_back</span>
          <span>Go Back</span>
        </button>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
